name: Agent Triage & Revision

permissions:
  contents: read

concurrency:
  group: agent-triage
  cancel-in-progress: false

on:
  schedule:
    # Her 4 saatte bir otomatik çalıştır
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Veritabanına yazmadan sadece test et)'
        type: boolean
        default: false
        required: false
      recheck:
        description: 'Daha önce ajan notu almış pending kayıtları da yeniden değerlendir'
        type: boolean
        default: false
        required: false
      limit:
        description: 'Maksimum incelenecek kayıt sayısı (Varsayılan: 50)'
        type: string
        default: '50'
        required: false

jobs:
  triage:
    name: Run Agent Triage & Human Revision
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent Triage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RECHECK: ${{ inputs.recheck }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$INPUT_RECHECK" = "true" ]; then
            ARGS+=(--recheck)
          fi

          LIMIT="${INPUT_LIMIT:-50}"
          if [ "$LIMIT" = "0" ] || [ "$LIMIT" = "all" ]; then
            :
          elif [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            ARGS+=(--limit "$LIMIT")
          else
            echo "Geçersiz limit: $LIMIT" >&2
            exit 2
          fi

          python validate_submissions.py "${ARGS[@]}"
