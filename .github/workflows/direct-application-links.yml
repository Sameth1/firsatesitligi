name: Direct Application Link Backfill

permissions:
  contents: read

concurrency:
  group: direct-application-links
  cancel-in-progress: false

on:
  schedule:
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maksimum aktif kayıt (0 = tümü)'
        type: string
        default: '0'
        required: false

jobs:
  resolve:
    name: Resolve direct application actions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve and store direct application links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${INPUT_LIMIT:-0}"
          ARGS=(--apply)
          if [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            ARGS+=(--limit "$LIMIT")
          elif [ "$LIMIT" != "0" ]; then
            echo "Geçersiz limit: $LIMIT" >&2
            exit 2
          fi
          python -u backfill_apply_links.py "${ARGS[@]}"
