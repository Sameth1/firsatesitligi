name: Opportunity Discovery

permissions:
  contents: read

concurrency:
  group: opportunity-discovery
  cancel-in-progress: false

on:
  schedule:
    # Haftada bir: Pazartesi Türkiye saatiyle 06:20 (UTC 03:20).
    # Günlükten haftalığa çekildi — kaynaklar (nasilgitmis, DAAD, SALTO) bu
    # sıklıkta yeni içerik üretmiyor, günlük tarama aynı sayfaları tekrar
    # tekrar indirip boşuna istek harcıyordu. Elle tetikleme her zaman açık.
    - cron: '20 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Veritabanına yazmadan tara'
        type: boolean
        default: true
        required: false
      source:
        description: 'Kaynak: all, nasilgitmis, daad veya salto'
        type: choice
        options: [all, nasilgitmis, daad, salto]
        default: all
        required: true
      limit:
        description: 'nasilgitmis için en fazla yeni detay; kuru çalıştırmada her kaynağın örneklemi (1-100)'
        type: string
        default: '30'
        required: false

jobs:
  discover:
    name: Find verified opportunity candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "scrapling[fetchers]==0.4.8"
          scrapling install

      - name: Discover new opportunities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          SOURCE="${INPUT_SOURCE:-all}"
          LIMIT="${INPUT_LIMIT:-30}"
          if [[ ! "$LIMIT" =~ ^[1-9][0-9]*$ ]] || [ "$LIMIT" -gt 100 ]; then
            echo "Geçersiz limit: $LIMIT" >&2
            exit 2
          fi

          if [[ ! "$SOURCE" =~ ^(all|nasilgitmis|daad|salto)$ ]]; then
            echo "Geçersiz kaynak: $SOURCE" >&2
            exit 2
          fi

          ARGS=()
          SAMPLE=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
            # Kuru çalıştırma kopya elemesi yapmaz, her ilanı açar; DAAD'ın 151
            # sayfası 45 dakikayı aşabiliyor. Önizleme için örneklem yeter.
            SAMPLE=(--limit "$LIMIT")
          fi

          # Her kaynak BAĞIMSIZ çalışır: biri çökerse diğerleri yine taranır,
          # koşu en sonda kırmızıya döner. (14 ve 21 Eylül'de DAAD'ın 403'ü
          # adımı öldürüyordu.) Geçici erişim sorunu çökme sayılmaz; scraper
          # ::warning:: yazıp temiz çıkar.
          failed=()
          if [[ "$SOURCE" == "all" || "$SOURCE" == "nasilgitmis" ]]; then
            python nasilgitmis_scraper.py "${ARGS[@]}" --max-pages 2 --limit "$LIMIT" \
              || failed+=(nasilgitmis)
          fi
          if [[ "$SOURCE" == "all" || "$SOURCE" == "daad" ]]; then
            python daad_scraper.py "${ARGS[@]}" "${SAMPLE[@]}" || failed+=(daad)
          fi
          if [[ "$SOURCE" == "all" || "$SOURCE" == "salto" ]]; then
            python salto_scraper.py "${ARGS[@]}" "${SAMPLE[@]}" || failed+=(salto)
          fi

          if (( ${#failed[@]} )); then
            echo "::error title=Keşif kaynağı çöktü::${failed[*]}"
            exit 1
          fi

      # Youth Opportunities bu ortamda tekrarlayan timeout verdi. Kaynak
      # sağlığı düzelmeden schedule'a eklenmeyecek.
